name: Sync translations

on:
  push:
    branches: ["main"]
    paths:
      - "langs/Fashion_en.xml"

concurrency:
  group: sync-fashion-translations
  cancel-in-progress: true

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync translations
        env:
          # Keep the generated report outside the repository working tree.
          SYNC_TRANSLATIONS_REPORT_PATH: ${{ runner.temp }}/translation-sync-summary.md
        run: node scripts/sync-translations.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          branch: sync/all
          delete-branch: true
          title: Sync Fashion translations
          commit-message: Sync Fashion translations
          body: |
            This PR was generated automatically by the translation sync workflow.

            Missing keys and sections were copied from `Fashion_en.xml` into the other Fashion language files as English fallbacks. Existing XML formatting and translations were preserved.
          add-paths: |
            langs/Fashion_*.xml
